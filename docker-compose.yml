services:
  # ============================================================================
  # PostgreSQL 16 (Relational DB for Auth, Users, metadata)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_knowledge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_knowledge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # ============================================================================
  # Redis 7 (Rate-limiting, Celery Queue, and Caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rag_network


  # ============================================================================
  # FastAPI Backend (Retrieval, LLM Orchestration, APIs)
  # ============================================================================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rag_knowledge_db}
      - REDIS_URL=redis://redis:6379/0

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend/app:/app/app # Live reloading for dev
      - ./backend/temp_uploads:/app/temp_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - rag_network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    # Use reload in dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ============================================================================
  # Celery Worker (Async Background Processing)
  # ============================================================================
  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_celery
    restart: unless-stopped
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rag_knowledge_db}
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend/app:/app/app
      - ./backend/temp_uploads:/app/temp_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]

  # ============================================================================
  # React Frontend (Enterprise UI)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rag_network

networks:
  rag_network:
    name: rag_network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
