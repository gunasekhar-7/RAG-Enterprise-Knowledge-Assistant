[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-knowledge-assistant"
version = "0.1.0"
description = "Enterprise-grade RAG knowledge retrieval and cited answer generation platform."
requires-python = ">=3.11"
authors = [
    { name = "GenAI & Backend Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "aioboto3>=13.1.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "gunicorn>=22.0.0",
    "python-multipart>=0.0.9",
    "litellm>=1.44.0",
    "openai>=1.42.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "langchain-text-splitters>=0.2.4",
    "tiktoken>=0.7.0",
    "pymupdf>=1.24.9",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.1",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "sentence-transformers>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.4",
    "mypy>=1.11.2",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "B904", "ARG001", "UP042", "SIM105", "B905", "SIM117", "B007"]
extend-ignore = ["E402", "B904", "ARG001", "UP042", "SIM105", "B905", "SIM117", "B007"]

[tool.setuptools]
packages = ["app"]
